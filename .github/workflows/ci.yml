name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # Arch matches the Qt and SQLite versions Omarchy ships.
    container: archlinux:latest
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed git nodejs sqlite qt6-declarative shellcheck
      - uses: actions/checkout@v4
      - name: Tests
        run: |
          node tests/logic.test.js
          node tests/store.test.js
          node tests/manifest.test.js
          node tests/cli.test.js
      # Qt 6's qmllint lives outside PATH on Arch. It fails on syntax errors;
      # unresolved Quickshell/Omarchy imports are only informational here.
      - name: Lint QML
        run: for f in *.qml components/*.qml; do /usr/lib/qt6/bin/qmllint "$f"; done
      - name: Lint installer
        run: |
          bash -n bin/habit
          shellcheck bin/habit
